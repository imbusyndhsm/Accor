<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACCOR - File Directory</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; padding: 40px; }
    .container { max-width: 800px; margin: 0 auto; background: #1e1e1e; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    h1 { color: #e91e63; border-bottom: 2px solid #333; padding-bottom: 12px; margin-top: 0; display: flex; align-items: center; gap: 10px; }
    ul { list-style: none; padding: 0; margin-top: 20px; }
    li { padding: 14px 16px; border-bottom: 1px solid #2a2a2a; display: flex; justify-content: space-between; align-items: center; border-radius: 6px; transition: background 0.2s; }
    li:hover { background-color: #252525; }
    a { color: #FF80AB; text-decoration: none; font-weight: 500; font-size: 1.05em; }
    a:hover { text-decoration: underline; }
    .btn { background: #e91e63; color: white; padding: 6px 12px; border-radius: 6px; text-decoration: none; font-size: 0.85em; font-weight: bold; }
    .btn:hover { background: #c2185b; text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📁 ACCOR Directory Index</h1>
    <ul>
      <!-- ඔයාගේ ෆයිල් එකතු කරද්දී මේ විදිහට පේළි එකතු කරන්න පුළුවන් -->
      <li>
        <a href="sample.pdf" target="_blank">📄 Sample Document.pdf</a>
        <a href="sample.pdf" class="btn" download>Download</a>
      </li>
    </ul>
  </div>
</body>
</html>
